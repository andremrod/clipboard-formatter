name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build and package
        run: ./scripts/package.sh
      - name: Version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: test -f "dist/ClipboardFormatter-${GITHUB_REF_NAME#v}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: ClipboardFormatter
          path: dist/*.dmg
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.dmg --title "ClipboardFormatter ${GITHUB_REF_NAME#v}" --generate-notes
